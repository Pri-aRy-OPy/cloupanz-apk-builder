plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cloupanz.apkbuilder'
    compileSdk 35

    defaultConfig {
        applicationId "com.cloupanz.apkbuilder"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
