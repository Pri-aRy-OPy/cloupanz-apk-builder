<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cloupanz APK</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            text-align: center;
        }

        .box {
            padding: 30px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #aeb8cc;
        }

        button {
            border: 0;
            padding: 14px 25px;
            border-radius: 12px;
            background: #2196f3;
            color: white;
            font-size: 16px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🚀 Cloupanz APK</h1>

    <p>
        APK berhasil dibuat menggunakan
        GitHub Actions.
    </p>

    <button onclick="hello()">
        TEST APK
    </button>

</div>

<script>
function hello() {
    alert("APK WebView berhasil berjalan! 🔥");
}
</script>

</body>
</html>
